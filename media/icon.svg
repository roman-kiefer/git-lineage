  <rect width="128" height="128" rx="26" fill="#1b1f27"/>
  <path d="M92.3 35.7 A40 40 0 1 0 104 64 H72" stroke="#e6e8ec" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="92.3" cy="35.7" r="10" fill="#1ea8ff"/>
  <circle cx="72" cy="64" r="10" fill="#ff2cc3"/>
</svg>
